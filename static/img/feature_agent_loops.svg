<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="loopgrad" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#1e6fd9"/>
<stop offset="100%" stop-color="#3dd8e8"/>
</linearGradient>
</defs>
<!-- outer loop: the code agent (test -> diagnose -> fix -> redeploy) -->
<path d="M 118.1 32.4 A 70 70 0 1 1 81.9 32.4" fill="none" stroke="#1e6fd9" stroke-width="7" stroke-linecap="round"/>
<!-- outer loop arrowhead (orange accent) -->
<path d="M 87.7 30.85 L 77.9 40.7 L 74.3 27.2 Z" fill="#f4623a"/>
<!-- inner loop: the browser agent (perceive -> act -> verify) -->
<path d="M 89.65 138.6 A 40 40 0 1 1 110.35 138.6" fill="none" stroke="url(#loopgrad)" stroke-width="6" stroke-linecap="round"/>
<!-- inner loop arrowhead -->
<path d="M 104.6 140.2 L 114.3 130.3 L 118.0 143.8 Z" fill="#1e6fd9"/>
<!-- central core: the app under test, nested inside both loops -->
<circle cx="100" cy="100" r="14" fill="url(#loopgrad)"/>
<circle cx="100" cy="100" r="5.5" fill="#ffffff" opacity="0.9"/>
<!-- small orbit accents -->
<g fill="#9fc9e8">
<circle cx="100" cy="30" r="4.5"/>
<circle cx="100" cy="140" r="4"/>
</g>
</svg>
