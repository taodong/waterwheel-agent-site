<svg viewBox="0 0 1180 748" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    </style>
    <marker id="ahBlue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L6,3 L0,6 Z" fill="#2563EB"/></marker>
    <marker id="ahAmber" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L6,3 L0,6 Z" fill="#D97706"/></marker>
    <marker id="ahGreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L6,3 L0,6 Z" fill="#059669"/></marker>
    <marker id="ahSlate" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L6,3 L0,6 Z" fill="#94A3B8"/></marker>
    <marker id="ahCoral" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L6,3 L0,6 Z" fill="#FF6F61"/></marker>
    <marker id="ahCoralR" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L6,3 L0,6 Z" fill="#FF6F61"/></marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1180" height="748" fill="#F8FAFC"/>

  <!-- header -->
  <text x="590" y="44" text-anchor="middle" font-size="30" font-weight="700" fill="#0F172A">One Test File, Two Environments</text>
  <text x="590" y="74" text-anchor="middle" font-size="15" fill="#475569">Reusing the same test text across Dev and QA &#8212; only the source of its variables changes</text>

  <!-- center divider (sources region only) -->
  <line x1="590" y1="150" x2="590" y2="320" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- ===================== DEV column ===================== -->
  <rect x="240" y="100" width="140" height="28" rx="14" fill="#1E293B"/>
  <text x="310" y="119" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">DEV &#183; local</text>
  <text x="310" y="144" text-anchor="middle" font-size="10.5" fill="#64748B">runs test id 2 only</text>

  <!-- DEV global context -->
  <rect x="70" y="152" width="230" height="156" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <circle cx="88" cy="176" r="5" fill="#2563EB"/>
  <text x="102" y="180" font-size="12" font-weight="700" fill="#1D4ED8">GLOBAL CONTEXT</text>
  <text x="88" y="198" font-size="10.5" fill="#3B82F6">shared &#183; injected into prompt</text>
  <line x1="84" y1="210" x2="286" y2="210" stroke="#BFDBFE" stroke-width="1"/>
  <text x="88" y="240" class="mono" font-size="13" fill="#1E3A8A">TEST_URL</text>
  <text x="88" y="266" class="mono" font-size="14" font-weight="600" fill="#0F172A">http://localhost:3000</text>

  <!-- DEV preset context -->
  <rect x="320" y="152" width="230" height="156" rx="10" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <circle cx="338" cy="176" r="5" fill="#D97706"/>
  <text x="352" y="180" font-size="12" font-weight="700" fill="#B45309">PRESET CONTEXT</text>
  <text x="338" y="198" font-size="10.5" fill="#D97706">seeded before run &#183; static</text>
  <line x1="334" y1="210" x2="536" y2="210" stroke="#FDE68A" stroke-width="1"/>
  <text x="338" y="240" class="mono" font-size="13" fill="#0F172A">username = localuser</text>
  <text x="338" y="264" class="mono" font-size="13" fill="#0F172A">password = 123456</text>
  <text x="338" y="294" font-size="10.5" font-style="italic" fill="#92400E">Known creds for fast local runs</text>

  <!-- DEV arrows -->
  <line x1="185" y1="308" x2="235" y2="356" stroke="#2563EB" stroke-width="1.8" marker-end="url(#ahBlue)"/>
  <line x1="435" y1="308" x2="400" y2="356" stroke="#D97706" stroke-width="1.8" marker-end="url(#ahAmber)"/>
  <rect x="173" y="320" width="74" height="20" rx="10" fill="#DBEAFE"/>
  <text x="210" y="334" text-anchor="middle" class="mono" font-size="11" fill="#1E40AF">TEST_URL</text>
  <rect x="348" y="320" width="142" height="20" rx="10" fill="#FEF3C7"/>
  <text x="419" y="334" text-anchor="middle" class="mono" font-size="11" fill="#92400E">username &#183; password</text>

  <!-- DEV test file id=2 -->
  <rect x="130" y="360" width="360" height="176" rx="12" fill="#ffffff" stroke="#FF6F61" stroke-width="2"/>
  <rect x="130" y="360" width="360" height="32" rx="12" fill="#FF6F61"/>
  <rect x="130" y="380" width="360" height="12" fill="#FF6F61"/>
  <rect x="144" y="368" width="38" height="17" rx="8" fill="#ffffff" fill-opacity="0.25"/>
  <text x="163" y="380" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">id 2</text>
  <text x="192" y="380" font-size="13" font-weight="700" fill="#ffffff">test_new_feature.md</text>
  <text x="476" y="380" text-anchor="end" font-size="10" font-style="italic" fill="#FFE3DF">&#183; unchanged</text>
  <text x="150" y="420" font-size="13" fill="#334155">1. Open</text>
  <rect x="214" y="408" width="86" height="19" rx="4" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="257" y="421" text-anchor="middle" class="mono" font-size="12" fill="#0F172A">TEST_URL</text>
  <text x="150" y="456" font-size="13" fill="#334155">2. Log in:</text>
  <rect x="224" y="444" width="86" height="19" rx="4" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="267" y="457" text-anchor="middle" class="mono" font-size="12" fill="#0F172A">username</text>
  <text x="318" y="457" font-size="13" fill="#64748B">/</text>
  <rect x="330" y="444" width="86" height="19" rx="4" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="373" y="457" text-anchor="middle" class="mono" font-size="12" fill="#0F172A">password</text>
  <text x="150" y="492" font-size="13" fill="#334155">3. Verify the new feature works</text>

  <!-- ===================== QA column ===================== -->
  <rect x="800" y="100" width="140" height="28" rx="14" fill="#1E293B"/>
  <text x="870" y="119" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">QA &#183; staging</text>
  <text x="870" y="144" text-anchor="middle" font-size="10.5" fill="#64748B">runs id 1 &#8594; id 2  (dependency)</text>

  <!-- QA global context -->
  <rect x="630" y="152" width="210" height="156" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <circle cx="648" cy="176" r="5" fill="#2563EB"/>
  <text x="662" y="180" font-size="12" font-weight="700" fill="#1D4ED8">GLOBAL CONTEXT</text>
  <text x="648" y="198" font-size="10.5" fill="#3B82F6">shared &#183; injected</text>
  <line x1="644" y1="210" x2="826" y2="210" stroke="#BFDBFE" stroke-width="1"/>
  <text x="648" y="240" class="mono" font-size="13" fill="#1E3A8A">TEST_URL</text>
  <text x="648" y="266" class="mono" font-size="14" font-weight="600" fill="#0F172A">https://qa.site</text>

  <!-- QA producer test id=1 -->
  <rect x="870" y="152" width="240" height="64" rx="8" fill="#ffffff" stroke="#FCA5A0" stroke-width="1.5"/>
  <rect x="882" y="160" width="40" height="18" rx="9" fill="#FF6F61"/>
  <text x="902" y="173" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">id 1</text>
  <text x="930" y="173" font-size="12" font-weight="600" fill="#0F172A">user creation</text>
  <text x="882" y="194" font-size="10.5" fill="#475569">Creates a user, then stores</text>
  <text x="882" y="208" font-size="10.5" fill="#475569">creds via context-manager.set</text>

  <!-- arrow id1 -> runtime -->
  <line x1="990" y1="216" x2="990" y2="228" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#ahSlate)"/>

  <!-- QA runtime context -->
  <rect x="870" y="230" width="240" height="78" rx="8" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <circle cx="886" cy="250" r="5" fill="#059669"/>
  <text x="898" y="254" font-size="11" font-weight="700" fill="#047857">RUNTIME CONTEXT &#183; generated</text>
  <text x="886" y="278" class="mono" font-size="11" fill="#0F172A">username = random_name</text>
  <text x="886" y="298" class="mono" font-size="11" fill="#0F172A">password = random_pw</text>

  <!-- QA arrows -->
  <line x1="735" y1="308" x2="790" y2="356" stroke="#2563EB" stroke-width="1.8" marker-end="url(#ahBlue)"/>
  <line x1="990" y1="308" x2="955" y2="356" stroke="#059669" stroke-width="1.8" marker-end="url(#ahGreen)"/>
  <rect x="725" y="320" width="74" height="20" rx="10" fill="#DBEAFE"/>
  <text x="762" y="334" text-anchor="middle" class="mono" font-size="11" fill="#1E40AF">TEST_URL</text>
  <rect x="901" y="320" width="142" height="20" rx="10" fill="#D1FAE5"/>
  <text x="972" y="334" text-anchor="middle" class="mono" font-size="11" fill="#065F46">username &#183; password</text>

  <!-- QA test file id=2 (identical) -->
  <rect x="690" y="360" width="360" height="176" rx="12" fill="#ffffff" stroke="#FF6F61" stroke-width="2"/>
  <rect x="690" y="360" width="360" height="32" rx="12" fill="#FF6F61"/>
  <rect x="690" y="380" width="360" height="12" fill="#FF6F61"/>
  <rect x="704" y="368" width="38" height="17" rx="8" fill="#ffffff" fill-opacity="0.25"/>
  <text x="723" y="380" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">id 2</text>
  <text x="752" y="380" font-size="13" font-weight="700" fill="#ffffff">test_new_feature.md</text>
  <text x="1036" y="380" text-anchor="end" font-size="10" font-style="italic" fill="#FFE3DF">&#183; unchanged</text>
  <text x="710" y="420" font-size="13" fill="#334155">1. Open</text>
  <rect x="774" y="408" width="86" height="19" rx="4" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="817" y="421" text-anchor="middle" class="mono" font-size="12" fill="#0F172A">TEST_URL</text>
  <text x="710" y="456" font-size="13" fill="#334155">2. Log in:</text>
  <rect x="784" y="444" width="86" height="19" rx="4" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="827" y="457" text-anchor="middle" class="mono" font-size="12" fill="#0F172A">username</text>
  <text x="878" y="457" font-size="13" fill="#64748B">/</text>
  <rect x="890" y="444" width="86" height="19" rx="4" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="933" y="457" text-anchor="middle" class="mono" font-size="12" fill="#0F172A">password</text>
  <text x="710" y="492" font-size="13" fill="#334155">3. Verify the new feature works</text>

  <!-- identical-file connector -->
  <line x1="496" y1="448" x2="684" y2="448" stroke="#FF6F61" stroke-width="2" marker-start="url(#ahCoralR)" marker-end="url(#ahCoral)"/>
  <rect x="547" y="434" width="86" height="28" rx="14" fill="#FF6F61"/>
  <text x="590" y="452" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">SAME FILE</text>

  <!-- takeaway -->
  <text x="590" y="562" text-anchor="middle" font-size="13" font-style="italic" fill="#475569">The test consumes whatever the environment provides &#8212; no edits to the test text.</text>

  <!-- legend -->
  <rect x="130" y="580" width="920" height="132" rx="12" fill="#ffffff" stroke="#E2E8F0"/>
  <text x="150" y="606" font-size="13" font-weight="700" fill="#0F172A">How each variable resolves</text>

  <circle cx="156" cy="633" r="6" fill="#2563EB"/>
  <text x="172" y="636" font-size="12" font-weight="700" fill="#1E40AF">Global Context</text>
  <text x="172" y="654" font-size="11" fill="#475569">Static, shared values injected into every test &#8212; e.g. TEST_URL.</text>

  <circle cx="606" cy="633" r="6" fill="#D97706"/>
  <text x="622" y="636" font-size="12" font-weight="700" fill="#92400E">Preset Context</text>
  <text x="622" y="654" font-size="11" fill="#475569">Seeded key/values, overridable. Handy for fixed local credentials.</text>

  <circle cx="156" cy="678" r="6" fill="#059669"/>
  <text x="172" y="681" font-size="12" font-weight="700" fill="#047857">Runtime Context</text>
  <text x="172" y="699" font-size="11" fill="#475569">Produced by a test during the run via context-manager.set.</text>

  <rect x="600" y="672" width="12" height="12" rx="3" fill="#FF6F61"/>
  <text x="622" y="681" font-size="12" font-weight="700" fill="#E0564A">Test under test</text>
  <text x="622" y="699" font-size="11" fill="#475569">The same file in every environment &#8212; its text is never edited.</text>
</svg>
